model:
  encoder:
    channels: 4
    channel_multipliers: [1, 2, 4]
    n_resnet_blocks: 2
    in_channels: 1
    z_channels: 1

  decoder:
    channels: 4
    channel_multipliers: [1, 2, 4]
    n_resnet_blocks: 2
    out_channels: 1
    z_channels: 1

  auto_encoder:
    emb_channels: 1
    z_channels: 1

training:
  use_cuda: true
  image_size: 32
  batch_size: 2048
  epochs: 100
  learning_rate: 1e-3
  weight_decay: 1e-3
  model_path: './checkpoint/mnist_VAE.pkl'
  load_model: false