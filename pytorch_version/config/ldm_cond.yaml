model:
  unet:
    in_channels: 1
    out_channels: 1
    channels: 32
    n_res_blocks: 1
    attention_levels: [2]
    channel_multipliers: [1, 1, 2]
    n_heads: 2
    tf_layers: 1
    d_cond: 128

  encoder:
    channels: 4
    channel_multipliers: [1, 2, 4]
    n_resnet_blocks: 2
    in_channels: 1
    z_channels: 1

  decoder:
    channels: 4
    channel_multipliers: [1, 2, 4]
    n_resnet_blocks: 2
    out_channels: 1
    z_channels: 1

  auto_encoder:
    emb_channels: 1
    z_channels: 1

  ldm:
    latent_scaling_factor: 1
    n_steps: 1000
    linear_start: 0.0001
    linear_end: 0.02

training:
  use_cuda: 1
  image_size: 32
  batch_size: 20000
  epochs: 100
  learning_rate: 1e-3
  weight_decay: 1e-3
  model_path: './checkpoint/mnist_cond_LDM.pkl'
  vae_model_path: './checkpoint/mnist_VAE.pkl'
  load_model: false
